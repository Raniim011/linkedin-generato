<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur de Post LinkedIn</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 650px; margin: 40px auto; padding: 20px; line-height: 1.6; }
        textarea { width: 100%; height: 90px; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #0a66c2; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 6px; margin-top: 10px; }
        button:hover { background-color: #084e96; }
        #result { margin-top: 20px; padding: 15px; background: #f3f2ef; border-radius: 8px; border: 1px solid #e0e0e0; white-space: pre-wrap; font-size: 15px; }
    </style>
</head>
<body>

    <h2>Générateur de Post LinkedIn</h2>
    
    <label for="topic"><b>Sujet de la publication :</b></label><br><br>
    <textarea id="topic" placeholder="Ex: Les meilleures pratiques pour réussir un stage PFE dans la tech..."></textarea><br>
    
    <button onclick="generatePost()">Rédiger le post</button>

    <h3>Résultat :</h3>
    <div id="result">Entrez un sujet ci-dessus et cliquez sur "Rédiger le post"...</div>

    <script>
        async function generatePost() {
            const topicInput = document.getElementById('topic').value;
            const resultDiv = document.getElementById('result');

            if (!topicInput.trim()) {
                alert("Veuillez saisir un sujet !");
                return;
            }

            resultDiv.innerText = "Génération en cours... Patientez quelques secondes.";

            try {
                const response = await fetch('https://ranim.app.n8n.cloud/webhook/linkedin-post', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json' 
                    },
                    body: JSON.stringify({ topic: topicInput })
                });

                const data = await response.json();

                if (data.post) {
                    resultDiv.innerText = data.post;
                } else if (typeof data === 'string') {
                    resultDiv.innerText = data;
                } else {
                    resultDiv.innerText = JSON.stringify(data, null, 2);
                }

            } catch (error) {
                resultDiv.innerText = "Erreur de connexion : " + error.message;
            }
        }
    </script>

</body>
</html>
